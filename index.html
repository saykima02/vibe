<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유진 바이브코딩 허브</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap">
<style>
/* Layout: 흰 여백 위의 얇은 타이포 헤더 + 좌측 계열사 레일 + 낮은 와이드 카드(미리보기 2:1, 메타 한 줄).
   Color: 유진그룹 홈페이지 #0042bf, 로고 네이비 #10205c / #06589f, 하늘색 #9ed4ff, 무채색 #080808 #e9e9e9 #fafafa */
:root{
  --bg:#fafafa; --surface:#ffffff; --ink:#080808; --muted:#5c6168; --line:#e9e9e9;
  --brand:#0042bf; --navy:#10205c; --sky:#9ed4ff;
  --accent:#0042bf; --accent-ink:#ffffff; --accent-soft:#eef3fc; --mark:#cfe3ff; --live:#12a150;
  --glow:rgba(0,66,191,.16); --shadow:0 1px 1px rgba(8,8,8,.03),0 14px 30px -18px rgba(16,32,92,.28);
  --ease:cubic-bezier(.2,.8,.2,1);
  /* 디자인 시스템 '우리 부서 포털' 타이포: Pretendard 단일 패밀리, 굵기·크기로만 위계 */
  --font-body:'Pretendard Variable','Pretendard','Noto Sans KR',-apple-system,sans-serif;
  --font-display:var(--font-body);
  --font-serif:var(--font-body);
  --font-mono:var(--font-body);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#060a18; --surface:#0c1330; --ink:#f1f4fb; --muted:#9ba7c6; --line:#1a2547;
    --accent:#6f9bff; --accent-ink:#060a18; --accent-soft:#10193d; --mark:#27407f; --live:#3ddc84;
    --glow:rgba(111,155,255,.2); --shadow:0 1px 1px rgba(0,0,0,.5),0 16px 34px -18px rgba(0,0,0,.8); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#060a18; --surface:#0c1330; --ink:#f1f4fb; --muted:#9ba7c6; --line:#1a2547;
  --accent:#6f9bff; --accent-ink:#060a18; --accent-soft:#10193d; --mark:#27407f; --live:#3ddc84;
  --glow:rgba(111,155,255,.2); --shadow:0 1px 1px rgba(0,0,0,.5),0 16px 34px -18px rgba(0,0,0,.8); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;animation:fade .8s ease backwards}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(150%)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes draw{from{transform:scaleX(0)}}
@keyframes drift1{50%{transform:translate(8vw,40px) scale(1.15)}}
@keyframes drift2{50%{transform:translate(-9vw,-30px) scale(1.1)}}
@keyframes pulse{50%{opacity:.3}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes spin-in{from{transform:rotate(-120deg) scale(.6);opacity:0}}

.wrap{max-width:1280px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
#prog{position:fixed;top:0;left:0;right:0;height:2px;background:var(--brand);transform:scaleX(0);transform-origin:0 50%;z-index:60;pointer-events:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--bg)}

/* 헤더 */
header{position:relative;overflow:hidden;padding-block:64px 40px}
.aurora{position:absolute;inset:0;pointer-events:none;z-index:0}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
.aurora i:nth-child(1){width:42vw;height:260px;left:-8vw;top:-60px;background:var(--sky);animation:drift1 16s ease-in-out infinite}
.aurora i:nth-child(2){width:34vw;height:240px;right:-6vw;top:10px;background:var(--brand);opacity:.16;animation:drift2 19s ease-in-out infinite}
.head{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:28px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand img{width:34px;height:34px;border-radius:50%;display:block;animation:spin-in 1.1s var(--ease) backwards}
.eyebrow{font:700 12px/1.4 var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;animation:rise .8s var(--ease) .15s backwards}
h1{margin:0;font-family:var(--font-serif);font-size:clamp(32px,5.6vw,60px);line-height:1.25;letter-spacing:-.03em;font-weight:800;text-wrap:balance}
.ln{display:inline-block;overflow:hidden;vertical-align:top;padding:.22em .08em .22em;margin:-.22em -.08em}
.ln>span{display:inline-block;animation:up 1s var(--ease) backwards}
.ln:nth-child(2)>span{animation-delay:.12s}
.ln:nth-child(3)>span{animation-delay:.24s}
h1 .b{font-weight:800;color:var(--accent)}
.lede{margin:18px 0 0;color:var(--muted);max-width:30em;font-size:16px;line-height:1.6;font-weight:400;text-wrap:pretty;animation:rise .9s var(--ease) .45s backwards}
.stats{display:flex;gap:36px;margin:0;padding:0;list-style:none;animation:rise .9s var(--ease) .55s backwards}
.stats li{display:flex;flex-direction:column;gap:4px}
.stats b{font:800 48px/1.2 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stats span{font-size:13px;color:var(--muted);letter-spacing:.04em}
.rule{position:relative;z-index:1;height:1px;margin-top:40px;background:linear-gradient(90deg,var(--brand),var(--sky) 40%,transparent);transform-origin:0 50%;animation:draw 1.4s var(--ease) .3s backwards}

/* 검색줄 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:18px;padding-block:12px}
.search{position:relative;flex:1 1 auto;min-width:0}
.search input{width:100%;padding:12px 44px 12px 44px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:400 15px var(--font-body);transition:border-color .25s,box-shadow .25s}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;transition:stroke .25s}
.search:focus-within svg{stroke:var(--accent)}
.search kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);font:500 11px var(--font-mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.live{display:flex;align-items:center;gap:9px;font:400 13px var(--font-body);letter-spacing:.01em;color:var(--muted);white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--live);flex:none;box-shadow:0 0 0 0 var(--live);animation:pulse 2s ease-in-out infinite}
.live.off i{background:var(--muted);animation:none}

/* 본문 */
.shell{display:grid;grid-template-columns:216px minmax(0,1fr);gap:48px;padding-block:36px 120px}
.rail{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:2px}
.rail h2{font:700 12px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px 14px}
.rail button{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:10px 14px;border-radius:10px;font:600 14px var(--font-body);cursor:pointer;transition:color .25s,background .25s,transform .25s var(--ease)}
.rail button:hover{color:var(--ink);background:var(--accent-soft);transform:translateX(4px)}
.rail button[aria-pressed="true"]{color:var(--ink);font-weight:700;background:var(--accent-soft)}
.rail button[aria-pressed="true"]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--brand);animation:draw .5s var(--ease) backwards;transform-origin:50% 0}
.rail .n{margin-left:auto;font:400 12px var(--font-mono);font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c,var(--brand));box-shadow:0 0 0 1px var(--line)}

.company{scroll-margin-top:96px}
.company+.company{margin-top:56px}
.company>h2{display:flex;align-items:center;gap:12px;margin:0;font-family:var(--font-serif);font-size:25px;font-weight:800;letter-spacing:-.02em}
.company>h2 .dot{width:10px;height:10px}
.dept{margin-top:26px}
.dept>h3{display:flex;align-items:center;gap:12px;margin:0 0 14px;font-size:13px;font-weight:400;color:var(--muted)}
.dept>h3 small{font:400 11px var(--font-mono);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.dept>h3::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px}

/* 카드: 낮고 넓게 */
.card{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;box-shadow:var(--shadow);transition:transform .45s var(--ease),border-color .3s,box-shadow .45s var(--ease)}
.card::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(280px circle at var(--mx,50%) var(--my,0%),var(--glow),transparent 70%)}
.card:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:0 2px 2px rgba(8,8,8,.04),0 24px 44px -20px var(--glow)}
.card:hover::before{opacity:1}
.card.pre{opacity:0;transform:translateY(18px)}
.card.enter{animation:rise .8s var(--ease) calc(var(--i,0)*70ms) backwards}
.preview{position:relative;aspect-ratio:2/1;max-width:100%;background:var(--accent-soft);overflow:hidden;border-bottom:1px solid var(--line)}
.zoom{position:absolute;inset:0;transition:transform 1.1s var(--ease)}
.card:hover .zoom{transform:scale(1.06)}
.preview iframe{position:absolute;top:0;left:0;width:1280px;height:640px;border:0;transform-origin:0 0;pointer-events:none;background:#fff}
.ph{position:absolute;inset:0;z-index:1;display:grid;place-items:center;padding:12px;text-align:center;font-size:12px;color:var(--muted);background:linear-gradient(100deg,transparent 30%,color-mix(in srgb,var(--surface) 70%,transparent) 50%,transparent 70%) 0 0/200% 100%;animation:shimmer 1.6s linear infinite}
.host{position:absolute;left:10px;bottom:10px;z-index:3;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:400 11px var(--font-mono);color:#fff;background:rgba(8,12,28,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:4px 10px;border-radius:999px}
.meta{position:relative;z-index:3;display:flex;align-items:center;gap:12px;padding:12px 16px}
.who{display:flex;flex-direction:column;min-width:0;flex:1}
.name{font-size:16px;font-weight:800;line-height:1.4}
.sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--accent);overflow:hidden;transition:background .3s,color .3s,border-color .3s,transform .5s var(--ease)}
.go svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .45s var(--ease)}
.card:hover .go{background:var(--brand);color:#fff;border-color:var(--brand);transform:rotate(45deg)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}

.empty{padding:88px 0;text-align:center;color:var(--muted);animation:rise .6s var(--ease) backwards}
.empty b{display:block;color:var(--ink);font-size:18px;font-weight:800;margin-bottom:6px}

@media (max-width:860px){
  header{padding-block:40px 28px}
  .rule{margin-top:28px}
  .shell{grid-template-columns:minmax(0,1fr);gap:22px;padding-top:20px}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:6px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rail h2{display:none}
  .rail button{width:auto;flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px}
  .rail button:hover{transform:none}
  .rail button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
  .rail button[aria-pressed="true"]::before{display:none}
  .stats{gap:26px}
  .stats b{font-size:30px}
  .live span{display:none}
  .bar .wrap{gap:14px}
  .search kbd{display:none}
}
/* 시스템 '애니메이션 줄이기'가 켜져 있어도(Windows·Edge 기본 설정에서 흔함) 페이지가 완전히 멈추지 않도록,
   등장 모션(fade·rise·up·draw·spin-in)과 호버 전환은 유지하고 계속 반복되는 모션만 끈다. */
@media (prefers-reduced-motion:reduce){
  .aurora i,.live i,.ph{animation:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>
<div id="prog" aria-hidden="true"></div>
<header>
  <div class="aurora" aria-hidden="true"><i></i><i></i></div>
  <div class="wrap head">
    <div>
      <div class="brand"><img src="favicon/apple-touch-icon.png" alt="" width="34" height="34"><p class="eyebrow">Group AI Education · Vibe Coding</p></div>
      <h1><span class="ln"><span>유진</span></span> <span class="ln"><span>바이브코딩</span></span> <span class="ln"><span class="b">허브</span></span></h1>
      <p class="lede">교육 참석자들이 직접 제작한 결과물을<br>미리 보고 바로 열어보세요.</p>
    </div>
    <ul class="stats" aria-label="현황">
      <li><b id="sCo">0</b><span>계열사</span></li>
      <li><b id="sDept">0</b><span>부서</span></li>
      <li><b id="sAll">0</b><span>결과물</span></li>
    </ul>
  </div>
  <div class="wrap"><div class="rule"></div></div>
</header>

<div class="bar">
  <div class="wrap">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="성명, 부서, 계열사로 검색" autocomplete="off" aria-label="검색">
      <kbd aria-hidden="true">/</kbd>
    </label>
    <div class="live" id="live"><i></i><span id="status">불러오는 중…</span></div>
  </div>
</div>

<main class="wrap shell">
  <nav class="rail" id="rail" aria-label="계열사"></nav>
  <div>
    <div id="list"></div>
    <div class="empty" id="empty" hidden></div>
  </div>
</main>

<script src="data.js"></script>
<script>
const CFG = window.HUB_CONFIG || {};
const REDUCE = false; // 등장 모션은 항상 사용 (반복 모션만 CSS에서 reduce 시 비활성)
// 유진그룹 브랜드 계열 색 (홈페이지 #0042bf, 로고 네이비/블루/하늘색)
const TONES = ["#0042bf","#10205c","#06589f","#3059c7","#9ed4ff","#6b7a99"];
let data = [], company = "전체", lastSig = "", animateNext = true;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hostOf = u => { try { const x = new URL(u); return x.hostname + (x.pathname !== "/" ? x.pathname : ""); } catch { return u; } };

/* ---------- CSV 파서 (따옴표/줄바꿈 대응) ---------- */
function parseCSV(t){
  const rows=[]; let r=[], f="", q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ r.push(f); f=""; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n')i++; r.push(f); rows.push(r); r=[]; f=""; }
    else f+=c;
  }
  if(f!==""||r.length){ r.push(f); rows.push(r); }
  return rows;
}
function rowsToData(rows){
  const h = rows.findIndex(r => r.some(c => c.trim()==="계열사"));
  if(h<0) return [];
  const head = rows[h].map(c=>c.trim());
  const ix = k => head.findIndex(c => c.replace(/\s/g,"").includes(k));
  const ic=ix("계열사"), id=ix("소속부서"), inm=ix("성명"), iu=ix("배포URL");
  return rows.slice(h+1).map(r => ({
    company:(r[ic]||"").trim(), dept:(r[id]||"").trim(), name:(r[inm]||"").trim(), url:(r[iu]||"").trim()
  })).filter(d => /^https?:\/\//i.test(d.url) && d.company);
}

/* ---------- 데이터 로드 ---------- */
async function load(){
  let rows = null, src = "예비 데이터", live = false;
  if(CFG.SHEET_CSV_URL){
    try{
      const u = CFG.SHEET_CSV_URL + (CFG.SHEET_CSV_URL.includes("?")?"&":"?") + "_=" + Date.now();
      const res = await fetch(u, {cache:"no-store"});
      if(!res.ok) throw new Error(res.status);
      rows = rowsToData(parseCSV(await res.text())); src = "구글 시트 실시간"; live = true;
    }catch(e){ console.warn("시트 로드 실패", e); src = "시트 연결 실패"; }
  }
  const time = new Date().toLocaleTimeString("ko-KR", {hour:"numeric", minute:"2-digit"});
  if(!rows){
    // 이미 화면에 데이터가 있으면 유지(일시적 실패로 카드가 사라지지 않도록). 최초 로드일 때만 예비 데이터 사용
    if(lastSig){ setStatus("연결이 잠시 끊겨 마지막 내용을 보여 드립니다", false); return; }
    rows = window.HUB_FALLBACK || [];
  }
  setStatus(live ? `실시간 연동 중 · ${time} 업데이트` : "저장된 목록을 보여 드립니다", live);
  const sig = JSON.stringify(rows);
  if(sig !== lastSig){ const first = !lastSig; lastSig = sig; data = rows; animateNext = first; render(); }
}
function setStatus(t, live){ $("status").textContent = t; $("live").classList.toggle("off", !live); }

/* ---------- 숫자 카운트업 ---------- */
function countTo(el, to){
  const from = +el.dataset.v || 0; el.dataset.v = to;
  if(REDUCE || from === to){ el.textContent = to; return; }
  const t0 = performance.now(), dur = 900;
  (function step(t){
    const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3);
    el.textContent = Math.round(from + (to-from)*e);
    if(p<1) requestAnimationFrame(step);
  })(t0);
}

/* ---------- 화면 ---------- */
function hl(text,q){
  const s=esc(text); if(!q) return s;
  const i=text.toLowerCase().indexOf(q); if(i<0) return s;
  return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length));
}
const ARROW = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg>`;
function render(){
  const q = $("q").value.trim().toLowerCase();
  const bySearch = data.filter(d => !q || [d.name,d.dept,d.company,d.url].some(v=>v.toLowerCase().includes(q)));
  const companies = [...new Set(data.map(d=>d.company))];
  const tone = c => TONES[companies.indexOf(c) % TONES.length];

  countTo($("sCo"), companies.length);
  countTo($("sDept"), new Set(data.map(d=>d.company+"|"+d.dept)).size);
  countTo($("sAll"), data.length);

  if(company!=="전체" && !companies.includes(company)) company = "전체";
  const count = c => bySearch.filter(d=>d.company===c).length;
  $("rail").innerHTML = `<h2>계열사</h2>` +
    [["전체", bySearch.length], ...companies.map(c=>[c,count(c)])].map(([c,n]) => `
    <button type="button" aria-pressed="${c===company}" data-c="${esc(c)}">
      ${c==="전체" ? "" : `<span class="dot" style="--c:${tone(c)}"></span>`}${esc(c)}<span class="n">${n}</span>
    </button>`).join("");
  $("rail").querySelectorAll("button").forEach(b => b.onclick = () => { company = b.dataset.c; animateNext = true; render(); });

  const rows = bySearch.filter(d => company==="전체" || d.company===company);
  const tree = {};
  rows.forEach(d => ((tree[d.company] ??= {})[d.dept||"부서 미지정"] ??= []).push(d));
  const pre = animateNext && !REDUCE ? " pre" : "";
  let k = 0;
  $("list").innerHTML = Object.entries(tree).map(([co,depts]) => `
    <section class="company"><h2><span class="dot" style="--c:${tone(co)}"></span>${hl(co,q)}</h2>
    ${Object.entries(depts).map(([dp,items]) => `
      <div class="dept"><h3>${hl(dp,q)}<small>${items.length}</small></h3>
      <div class="grid">${items.map(d => `
        <a class="card${pre}" style="--i:${(k++)%6}" href="${esc(d.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(d.name)} 사이트 열기">
          <div class="preview" data-url="${esc(d.url)}">
            <div class="zoom"></div>
            <div class="ph">미리보기 불러오는 중…</div>
            <span class="host">${esc(hostOf(d.url))}</span>
          </div>
          <div class="meta">
            <div class="who"><span class="name">${hl(d.name,q)}</span><span class="sub">${esc(d.dept)}</span></div>
            <span class="go">${ARROW}</span>
          </div>
        </a>`).join("")}</div></div>`).join("")}
    </section>`).join("");
  animateNext = false;

  const empty = $("empty");
  if(rows.length){ empty.hidden = true; }
  else {
    empty.hidden = false;
    empty.innerHTML = data.length
      ? `<b>검색 결과가 없습니다</b>다른 이름이나 부서로 검색해 보세요.`
      : `<b>아직 등록된 결과물이 없습니다</b>구글 시트의 배포 URL 칸에 주소를 입력하면 이곳에 나타납니다.`;
  }
  setupCards();
}

/* ---------- 카드 등장(스크롤 시) + 미리보기 지연 로드 ---------- */
const reveal = new IntersectionObserver(es => es.forEach(e => {
  if(!e.isIntersecting) return; reveal.unobserve(e.target);
  e.target.classList.remove("pre"); e.target.classList.add("enter");
}),{threshold:.08});
const io = new IntersectionObserver(es => es.forEach(e => {
  if(!e.isIntersecting) return; io.unobserve(e.target);
  const box=e.target, f=document.createElement("iframe");
  f.src=box.dataset.url; f.loading="lazy"; f.tabIndex=-1; f.title="미리보기";
  f.setAttribute("sandbox","allow-scripts allow-same-origin");
  f.referrerPolicy="no-referrer";
  f.onload=()=>box.querySelector(".ph")?.remove();
  box.querySelector(".zoom").appendChild(f); fit(box);
  setTimeout(()=>{const p=box.querySelector(".ph"); if(p){ p.style.animation="none"; p.textContent="미리보기를 표시할 수 없습니다. 카드를 눌러 열어 보세요."; }},8000);
}),{rootMargin:"200px"});
function fit(box){ const f=box.querySelector("iframe"); if(f) f.style.transform=`scale(${box.clientWidth/1280})`; }
const ro = new ResizeObserver(es => es.forEach(e => fit(e.target)));
function setupCards(){
  document.querySelectorAll(".card.pre").forEach(c => reveal.observe(c));
  document.querySelectorAll(".preview").forEach(b => { io.observe(b); ro.observe(b); });
}

/* ---------- 카드 위 마우스를 따라가는 빛 ---------- */
$("list").addEventListener("pointermove", e => {
  const c = e.target.closest(".card"); if(!c) return;
  const r = c.getBoundingClientRect();
  c.style.setProperty("--mx", (e.clientX-r.left)+"px"); c.style.setProperty("--my", (e.clientY-r.top)+"px");
});

/* ---------- 상단 스크롤 진행선 ---------- */
let tick = false;
addEventListener("scroll", () => {
  if(tick) return; tick = true;
  requestAnimationFrame(() => {
    const h = document.documentElement.scrollHeight - innerHeight;
    $("prog").style.transform = `scaleX(${h>0 ? Math.min(1,scrollY/h) : 0})`; tick = false;
  });
},{passive:true});

$("q").addEventListener("input", render);
document.addEventListener("keydown", e => {
  if(e.key==="/" && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){ e.preventDefault(); $("q").focus(); }
});
load();
if(CFG.REFRESH_SEC>0) setInterval(()=>{ if(!document.hidden) load(); }, CFG.REFRESH_SEC*1000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) load(); });
</script>
</body>
