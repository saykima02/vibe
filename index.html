<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유진 바이브코딩 허브</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 좌측 계열사 레일(건수) + 우측 부서별 카드 그리드. 모바일에서는 레일이 가로 스크롤 줄이 된다. */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --ink:#111827; --muted:#58637a; --line:#dce1ec;
  --accent:#0a409e; --accent-ink:#ffffff; --accent-soft:#e3ebf8; --mark:#ffe8a3; --live:#12a150;
  --dot-l:46%; --shadow:0 1px 2px rgba(17,24,39,.05),0 8px 24px -12px rgba(17,24,39,.18);
  --font-body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c111e; --surface:#141b2d; --ink:#e8ecf6; --muted:#94a1bc; --line:#222c45;
    --accent:#8fb0ff; --accent-ink:#0c111e; --accent-soft:#19264b; --mark:#5c4a12; --live:#3ddc84;
    --dot-l:64%; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c111e; --surface:#141b2d; --ink:#e8ecf6; --muted:#94a1bc; --line:#222c45;
  --accent:#8fb0ff; --accent-ink:#0c111e; --accent-soft:#19264b; --mark:#5c4a12; --live:#3ddc84;
  --dot-l:64%; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

.wrap{max-width:1280px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}

/* 헤더 */
header{padding-block:56px 28px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px}
.eyebrow{font:500 12px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 14px}
h1{margin:0;font-size:clamp(30px,5.2vw,52px);line-height:1.12;letter-spacing:-.03em;font-weight:700;text-wrap:balance}
.lede{margin:14px 0 0;color:var(--muted);max-width:46ch;font-size:16px;text-wrap:pretty}
.stats{display:flex;gap:28px;margin:0;padding:0;list-style:none}
.stats li{display:flex;flex-direction:column;gap:2px}
.stats b{font:500 30px/1 var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stats span{font-size:13px;color:var(--muted)}

/* 검색줄 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-block:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.bar .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.search{position:relative;flex:1 1 320px;min-width:0}
.search input{width:100%;padding:12px 44px 12px 42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:400 15px var(--font-body)}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:500 11px var(--font-mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:2px 6px}
.live{display:flex;align-items:center;gap:8px;font:400 12px var(--font-mono);color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--live);flex:none;animation:pulse 2s ease-in-out infinite}
.live.off i{background:var(--muted);animation:none}
@keyframes pulse{50%{opacity:.35}}

/* 본문 */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:40px;padding-block:28px 96px}
.rail{position:sticky;top:calc(76px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:2px}
.rail h2{font:500 11px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px 12px}
.rail button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:9px 12px;border-radius:8px;font:500 14px var(--font-body);cursor:pointer}
.rail button:hover{background:var(--accent-soft)}
.rail button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rail .n{margin-left:auto;font:400 12px var(--font-mono);font-variant-numeric:tabular-nums;opacity:.75}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:hsl(var(--h,220) 62% var(--dot-l))}
.rail button[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--accent-ink)}

.company{scroll-margin-top:90px}
.company+.company{margin-top:48px}
.company>h2{display:flex;align-items:center;gap:12px;margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
.company>h2 .dot{width:12px;height:12px}
.dept{margin-top:22px}
.dept>h3{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;font-size:14px;font-weight:600;color:var(--muted)}
.dept>h3 small{font:400 12px var(--font-mono)}
.dept>h3::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:18px}

/* 카드 */
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;box-shadow:var(--shadow);transition:transform .18s ease,border-color .18s ease}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.shot{border-bottom:1px solid var(--line)}
.chrome{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.chrome i{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.host{margin-left:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:400 11px var(--font-mono);color:var(--muted)}
.preview{position:relative;aspect-ratio:16/10;max-width:100%;background:var(--accent-soft);overflow:hidden}
.preview iframe{position:absolute;top:0;left:0;width:1280px;height:800px;border:0;transform-origin:0 0;pointer-events:none;background:#fff}
.ph{position:absolute;inset:0;display:grid;place-items:center;padding:16px;text-align:center;font-size:12px;color:var(--muted)}
.meta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:14px 16px 16px;align-items:center}
.name{font-size:18px;font-weight:700;letter-spacing:-.01em}
.sub{grid-column:1;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.open{grid-row:1/3;grid-column:2;font:500 12px var(--font-mono);color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:5px 11px;transition:background .18s,color .18s}
.card:hover .open{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

.empty{padding:72px 0;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}

@media (max-width:860px){
  header{padding-block:36px 20px}
  .shell{grid-template-columns:minmax(0,1fr);gap:20px;padding-top:16px}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:6px;scrollbar-width:thin}
  .rail h2{display:none}
  .rail button{width:auto;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px}
  .rail button[aria-pressed="true"]{border-color:var(--accent)}
  .stats b{font-size:24px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>
<header>
  <div class="wrap head">
    <div>
      <p class="eyebrow">Group AI Education · Vibe Coding</p>
      <h1>유진 바이브코딩 허브</h1>
      <p class="lede">교육 참석자들이 직접 만든 결과물을 계열사와 부서별로 미리 보고, 바로 열어 보세요.</p>
    </div>
    <ul class="stats" aria-label="현황">
      <li><b id="sCo">0</b><span>계열사</span></li>
      <li><b id="sDept">0</b><span>부서</span></li>
      <li><b id="sAll">0</b><span>결과물</span></li>
    </ul>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="성명, 부서, 계열사로 검색" autocomplete="off" aria-label="검색">
      <kbd aria-hidden="true">/</kbd>
    </label>
    <div class="live" id="live"><i></i><span id="status">불러오는 중…</span></div>
  </div>
</div>

<main class="wrap shell">
  <nav class="rail" id="rail" aria-label="계열사"></nav>
  <div>
    <div id="list"></div>
    <div class="empty" id="empty" hidden></div>
  </div>
</main>

<script src="data.js"></script>
<script>
const CFG = window.HUB_CONFIG || {};
let data = [], company = "전체", lastSig = "";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const hostOf = u => { try { const x = new URL(u); return x.hostname + (x.pathname !== "/" ? x.pathname : ""); } catch { return u; } };

/* ---------- CSV 파서 (따옴표/줄바꿈 대응) ---------- */
function parseCSV(t){
  const rows=[]; let r=[], f="", q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ r.push(f); f=""; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n')i++; r.push(f); rows.push(r); r=[]; f=""; }
    else f+=c;
  }
  if(f!==""||r.length){ r.push(f); rows.push(r); }
  return rows;
}
function rowsToData(rows){
  const h = rows.findIndex(r => r.some(c => c.trim()==="계열사"));
  if(h<0) return [];
  const head = rows[h].map(c=>c.trim());
  const ix = k => head.findIndex(c => c.replace(/\s/g,"").includes(k));
  const ic=ix("계열사"), id=ix("소속부서"), inm=ix("성명"), iu=ix("배포URL");
  return rows.slice(h+1).map(r => ({
    company:(r[ic]||"").trim(), dept:(r[id]||"").trim(), name:(r[inm]||"").trim(), url:(r[iu]||"").trim()
  })).filter(d => /^https?:\/\//i.test(d.url) && d.company);
}

/* ---------- 데이터 로드 ---------- */
async function load(){
  let rows = null, src = "예비 데이터", live = false;
  if(CFG.SHEET_CSV_URL){
    try{
      const u = CFG.SHEET_CSV_URL + (CFG.SHEET_CSV_URL.includes("?")?"&":"?") + "_=" + Date.now();
      const res = await fetch(u, {cache:"no-store"});
      if(!res.ok) throw new Error(res.status);
      rows = rowsToData(parseCSV(await res.text())); src = "구글 시트 실시간"; live = true;
    }catch(e){ console.warn("시트 로드 실패", e); src = "시트 연결 실패"; }
  }
  const time = new Date().toLocaleTimeString("ko-KR");
  if(!rows){
    // 이미 화면에 데이터가 있으면 유지(일시적 실패로 카드가 사라지지 않도록). 최초 로드일 때만 예비 데이터 사용
    if(lastSig){ setStatus(`${src} · 이전 데이터 유지 중 (${time})`, false); return; }
    rows = window.HUB_FALLBACK || [];
  }
  setStatus(`${src} · ${time} 갱신`, live);
  const sig = JSON.stringify(rows);
  if(sig !== lastSig){ lastSig = sig; data = rows; render(); }
}
function setStatus(t, live){ $("status").textContent = t; $("live").classList.toggle("off", !live); }

/* ---------- 화면 ---------- */
function hl(text,q){
  const s=esc(text); if(!q) return s;
  const i=text.toLowerCase().indexOf(q); if(i<0) return s;
  return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length));
}
function render(){
  const q = $("q").value.trim().toLowerCase();
  const bySearch = data.filter(d => !q || [d.name,d.dept,d.company,d.url].some(v=>v.toLowerCase().includes(q)));

  // 통계
  $("sCo").textContent = new Set(data.map(d=>d.company)).size;
  $("sDept").textContent = new Set(data.map(d=>d.company+"|"+d.dept)).size;
  $("sAll").textContent = data.length;

  // 계열사 레일 (건수는 검색 결과 기준)
  const companies = [...new Set(data.map(d=>d.company))];
  if(company!=="전체" && !companies.includes(company)) company = "전체";
  const count = c => bySearch.filter(d=>d.company===c).length;
  $("rail").innerHTML = `<h2>계열사</h2>` +
    [["전체", bySearch.length], ...companies.map(c=>[c,count(c)])].map(([c,n]) => `
    <button type="button" aria-pressed="${c===company}" data-c="${esc(c)}">
      ${c==="전체" ? "" : `<span class="dot" style="--h:${hue(c)}"></span>`}${esc(c)}<span class="n">${n}</span>
    </button>`).join("");
  $("rail").querySelectorAll("button").forEach(b => b.onclick = () => { company = b.dataset.c; render(); });

  // 본문: 계열사 > 부서 > 카드
  const rows = bySearch.filter(d => company==="전체" || d.company===company);
  const tree = {};
  rows.forEach(d => ((tree[d.company] ??= {})[d.dept||"부서 미지정"] ??= []).push(d));
  $("list").innerHTML = Object.entries(tree).map(([co,depts]) => `
    <section class="company"><h2><span class="dot" style="--h:${hue(co)}"></span>${hl(co,q)}</h2>
    ${Object.entries(depts).map(([dp,items]) => `
      <div class="dept"><h3>${hl(dp,q)}<small>${items.length}</small></h3>
      <div class="grid">${items.map(d => `
        <a class="card" href="${esc(d.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(d.name)} 사이트 열기">
          <div class="shot">
            <div class="chrome"><i></i><i></i><i></i><span class="host">${esc(hostOf(d.url))}</span></div>
            <div class="preview" data-url="${esc(d.url)}"><div class="ph">미리보기 불러오는 중…</div></div>
          </div>
          <div class="meta"><span class="name">${hl(d.name,q)}</span><span class="sub">${esc(d.dept)}</span><span class="open">열기 ↗</span></div>
        </a>`).join("")}</div></div>`).join("")}
    </section>`).join("");

  const empty = $("empty");
  if(rows.length){ empty.hidden = true; }
  else {
    empty.hidden = false;
    empty.innerHTML = data.length
      ? `<b>검색 결과가 없습니다</b>다른 이름이나 부서로 검색해 보세요.`
      : `<b>아직 등록된 결과물이 없습니다</b>구글 시트의 배포 URL 칸에 주소를 입력하면 이곳에 나타납니다.`;
  }
  setupPreviews();
}

/* ---------- 미리보기: 화면에 보일 때만 iframe 로드, 폭에 맞춰 축소 ---------- */
const io = new IntersectionObserver(es => es.forEach(e => {
  if(!e.isIntersecting) return; io.unobserve(e.target);
  const box=e.target, f=document.createElement("iframe");
  f.src=box.dataset.url; f.loading="lazy"; f.tabIndex=-1; f.title="미리보기";
  f.setAttribute("sandbox","allow-scripts allow-same-origin");
  f.referrerPolicy="no-referrer";
  f.onload=()=>box.querySelector(".ph")?.remove();
  box.appendChild(f); fit(box);
  setTimeout(()=>{const p=box.querySelector(".ph"); if(p) p.textContent="미리보기를 표시할 수 없습니다. 카드를 눌러 열어 보세요.";},8000);
}),{rootMargin:"200px"});
function fit(box){ const f=box.querySelector("iframe"); if(f) f.style.transform=`scale(${box.clientWidth/1280})`; }
const ro = new ResizeObserver(es => es.forEach(e => fit(e.target)));
function setupPreviews(){ document.querySelectorAll(".preview").forEach(b=>{io.observe(b);ro.observe(b);}); }

$("q").addEventListener("input", render);
document.addEventListener("keydown", e => {
  if(e.key==="/" && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){ e.preventDefault(); $("q").focus(); }
});
load();
if(CFG.REFRESH_SEC>0) setInterval(()=>{ if(!document.hidden) load(); }, CFG.REFRESH_SEC*1000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) load(); });
</script>
</body>
</html>
