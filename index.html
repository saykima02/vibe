<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유진 바이브코딩 허브</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#1a2233;--muted:#667085;--line:#e4e8f0;--accent:#2557d6;--accent-soft:#e8eefc}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#171e2e;--text:#e8ecf5;--muted:#95a0b8;--line:#263049;--accent:#7aa2ff;--accent-soft:#1d2b4d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif}
header{padding:48px 16px 16px;text-align:center}
header h1{margin:0 0 8px;font-size:clamp(24px,5vw,36px)}
header p{margin:0;color:var(--muted)}
main{max-width:1200px;margin:0 auto;padding:0 16px 64px}
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:16px 0 8px;display:flex;flex-wrap:wrap;gap:12px}
.tools input{flex:1 1 260px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 14px;border-radius:999px;cursor:pointer;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.status{color:var(--muted);font-size:13px;margin:8px 0 4px}
.company{margin-top:36px}
.company>h2{font-size:22px;margin:0 0 4px;padding-bottom:8px;border-bottom:2px solid var(--accent)}
.dept{margin-top:20px}
.dept>h3{font-size:15px;color:var(--muted);margin:0 0 10px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.preview{position:relative;aspect-ratio:16/10;background:var(--accent-soft);overflow:hidden;border-bottom:1px solid var(--line)}
.preview iframe{position:absolute;top:0;left:0;width:1280px;height:800px;border:0;transform-origin:0 0;pointer-events:none;background:#fff}
.preview .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}
.info{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.name{font-size:18px;font-weight:700}
.sub{color:var(--muted);font-size:13px}
.go{color:var(--accent);font-size:13px;font-weight:600;margin-top:4px}
.empty{text-align:center;color:var(--muted);padding:64px 0}
mark{background:#ffe58a;color:#000;border-radius:3px}
</style>
</head>
<body>
<header>
  <h1>유진 바이브코딩 허브</h1>
  <p>그룹 AI 교육 참석자들이 만든 결과물을 계열사·부서별로 미리 보고 바로 열어 보세요</p>
</header>
<main>
  <div class="tools">
    <input id="q" type="search" placeholder="성명 · 부서 · 계열사 검색 (입력 즉시 반영)" autofocus>
    <div class="chips" id="chips"></div>
  </div>
  <div class="status" id="status"></div>
  <div id="list"></div>
  <div class="empty" id="empty" hidden>조건에 맞는 결과물이 없습니다.</div>
</main>
<script src="data.js"></script>
<script>
const CFG = window.HUB_CONFIG || {};
let data = [], company = "전체", lastSig = "";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- CSV 파서 (따옴표/줄바꿈 대응) ---------- */
function parseCSV(t){
  const rows=[]; let r=[], f="", q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ r.push(f); f=""; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n')i++; r.push(f); rows.push(r); r=[]; f=""; }
    else f+=c;
  }
  if(f!==""||r.length){ r.push(f); rows.push(r); }
  return rows;
}
function rowsToData(rows){
  // 제목행이 있어도 '계열사' 가 들어 있는 행을 헤더로 인식
  const h = rows.findIndex(r => r.some(c => c.trim()==="계열사"));
  if(h<0) return [];
  const head = rows[h].map(c=>c.trim());
  const ix = k => head.findIndex(c => c.replace(/\s/g,"").includes(k));
  const ic=ix("계열사"), id=ix("소속부서"), inm=ix("성명"), iu=ix("배포URL");
  return rows.slice(h+1).map(r => ({
    company:(r[ic]||"").trim(), dept:(r[id]||"").trim(), name:(r[inm]||"").trim(), url:(r[iu]||"").trim()
  })).filter(d => /^https?:\/\//i.test(d.url) && d.company);
}

/* ---------- 데이터 로드 ---------- */
async function load(){
  let rows = null, src = "예비 데이터";
  if(CFG.SHEET_CSV_URL){
    try{
      const u = CFG.SHEET_CSV_URL + (CFG.SHEET_CSV_URL.includes("?")?"&":"?") + "_=" + Date.now();
      const res = await fetch(u, {cache:"no-store"});
      if(!res.ok) throw new Error(res.status);
      rows = rowsToData(parseCSV(await res.text())); src = "구글 시트 실시간";
    }catch(e){ console.warn("시트 로드 실패, 예비 데이터 사용", e); src = "예비 데이터 (시트 연결 실패)"; }
  }
  if(!rows) rows = window.HUB_FALLBACK || [];
  const sig = JSON.stringify(rows);
  $("status").textContent = `${src} · ${new Date().toLocaleTimeString("ko-KR")} 갱신`;
  if(sig !== lastSig){ lastSig = sig; data = rows; chips(); render(); }
}

/* ---------- 화면 ---------- */
function chips(){
  const list = ["전체", ...new Set(data.map(d=>d.company))];
  if(!list.includes(company)) company="전체";
  $("chips").innerHTML = list.map(c=>`<button class="chip ${c===company?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{company=b.dataset.c;chips();render();});
}
function hl(text,q){
  const s=esc(text); if(!q) return s;
  const i=text.toLowerCase().indexOf(q); if(i<0) return s;
  return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length));
}
function render(){
  const q = $("q").value.trim().toLowerCase();
  const rows = data.filter(d => (company==="전체"||d.company===company) &&
    (!q || [d.name,d.dept,d.company,d.url].some(v=>v.toLowerCase().includes(q))));
  const tree = {};
  rows.forEach(d => ((tree[d.company] ??= {})[d.dept||"부서 미지정"] ??= []).push(d));
  $("list").innerHTML = Object.entries(tree).map(([co,depts]) => `
    <section class="company"><h2>${hl(co,q)}</h2>
    ${Object.entries(depts).map(([dp,items]) => `
      <div class="dept"><h3>${hl(dp,q)} · ${items.length}건</h3>
      <div class="grid">${items.map(d => `
        <a class="card" href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">
          <div class="preview" data-url="${esc(d.url)}"><div class="ph">미리보기 불러오는 중…</div></div>
          <div class="info"><span class="name">${hl(d.name,q)}</span>
          <span class="sub">${esc(d.company)} · ${esc(d.dept)}</span><span class="go">사이트 열기 →</span></div>
        </a>`).join("")}</div></div>`).join("")}
    </section>`).join("");
  $("empty").hidden = rows.length>0;
  setupPreviews();
}

/* ---------- index.html 미리보기: 화면에 보일 때만 iframe 로드, 폭에 맞춰 축소 ---------- */
const io = new IntersectionObserver(es => es.forEach(e => {
  if(!e.isIntersecting) return; io.unobserve(e.target);
  const box=e.target, f=document.createElement("iframe");
  f.src=box.dataset.url; f.loading="lazy"; f.tabIndex=-1; f.title="미리보기";
  f.setAttribute("sandbox","allow-scripts allow-same-origin");
  f.referrerPolicy="no-referrer";
  f.onload=()=>box.querySelector(".ph")?.remove();
  box.appendChild(f); fit(box);
  setTimeout(()=>{const p=box.querySelector(".ph"); if(p) p.textContent="미리보기를 표시할 수 없습니다 — 카드를 눌러 열어 보세요";},8000);
}),{rootMargin:"200px"});
function fit(box){ const f=box.querySelector("iframe"); if(f) f.style.transform=`scale(${box.clientWidth/1280})`; }
const ro = new ResizeObserver(es => es.forEach(e => fit(e.target)));
function setupPreviews(){ document.querySelectorAll(".preview").forEach(b=>{io.observe(b);ro.observe(b);}); }

$("q").addEventListener("input", render);
load();
if(CFG.REFRESH_SEC>0) setInterval(load, CFG.REFRESH_SEC*1000);
</script>
</body>
</html>
